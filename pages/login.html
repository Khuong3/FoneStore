<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - FoneStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold:        #d4af37;
            --gold-light:  #f5d76e;
            --gold-soft:   rgba(212, 175, 55, 0.1);
            --gold-border: rgba(212, 175, 55, 0.25);
            --dark:        #111111;
            --font-main:   'Montserrat', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            min-height: 100vh;
            background: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -20%;
            right: -15%;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.09) 0%, transparent 70%);
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -25%;
            left: -15%;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(212,175,55,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212,175,55,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .form-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }

        .brand-top {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand-top .logo-text {
            font-weight: 800;
            font-size: 30px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            text-shadow: 0 0 50px rgba(212,175,55,0.35);
        }
        .brand-top .logo-text span { color: #fff; }
        .brand-top .tagline {
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.28);
            margin-top: 6px;
            font-weight: 500;
        }

        .auth-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(212,175,55,0.15);
            border-radius: 24px;
            padding: 44px 40px;
            backdrop-filter: blur(20px);
            box-shadow:
                0 0 0 1px rgba(0,0,0,0.3),
                0 40px 80px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(212,175,55,0.1);
        }

        .auth-card h5 {
            font-weight: 800;
            font-size: 20px;
            color: #fff;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .auth-card .subtitle {
            font-size: 12px;
            color: rgba(255,255,255,0.38);
            font-weight: 500;
            margin-bottom: 32px;
        }

        .form-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            margin-bottom: 8px;
            display: block;
        }

        .input-group-text {
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-right: none !important;
            border-radius: 12px 0 0 12px !important;
            color: rgba(212,175,55,0.6) !important;
            padding: 0 14px;
            transition: all 0.25s;
        }

        .form-control {
            font-family: var(--font-main);
            font-size: 13.5px;
            font-weight: 500;
            color: #fff !important;
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-left: none !important;
            border-radius: 0 12px 12px 0 !important;
            padding: 14px 16px !important;
            transition: all 0.25s ease;
            box-shadow: none !important;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.18) !important; }

        .input-group:focus-within .input-group-text {
            border-color: rgba(212,175,55,0.5) !important;
            background: rgba(212,175,55,0.08) !important;
            color: var(--gold) !important;
        }
        .input-group:focus-within .form-control {
            background: rgba(212,175,55,0.06) !important;
            border-color: rgba(212,175,55,0.5) !important;
            box-shadow: none !important;
        }

        /* Password with eye */
        .form-control.with-eye {
            border-radius: 0 !important;
        }
        .btn-eye {
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-left: none !important;
            border-radius: 0 12px 12px 0 !important;
            color: rgba(255,255,255,0.3) !important;
            padding: 0 14px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .btn-eye:hover { color: var(--gold) !important; }

        .input-group:focus-within .btn-eye {
            border-color: rgba(212,175,55,0.5) !important;
            background: rgba(212,175,55,0.06) !important;
        }

        .mb-field { margin-bottom: 18px; }

        /* Forgot password */
        .forgot-link {
            display: block;
            text-align: right;
            font-size: 11px;
            font-weight: 600;
            color: rgba(212,175,55,0.6);
            text-decoration: none;
            margin-top: -8px;
            margin-bottom: 24px;
            transition: 0.2s;
        }
        .forgot-link:hover { color: var(--gold); }

        .btn-login {
            font-family: var(--font-main);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 16px;
            width: 100%;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #111;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 24px rgba(212,175,55,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(212,175,55,0.4);
        }
        .btn-login:active { transform: scale(0.99); }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 22px 0;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.2);
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }

        .register-link {
            text-align: center;
            font-size: 13px;
            color: rgba(255,255,255,0.35);
        }
        .register-link a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s;
        }
        .register-link a:hover { color: var(--gold-light); text-decoration: underline; }

        /* Trust badges */
        .trust-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 28px;
        }
        .trust-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.2);
            font-weight: 600;
        }
        .trust-item i {
            font-size: 16px;
            color: rgba(212,175,55,0.35);
        }

        @media (max-width: 576px) {
            .auth-card { padding: 30px 22px; }
            .brand-top .logo-text { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>

    <div class="form-wrapper">
        <div class="brand-top">
            <div class="logo-text">F<Span>one</Span>S<span>tore</Span></div>
            <div class="tagline">Biggest Website for Selling Electronics</div>
        </div>

        <div class="auth-card">
            <h5>Chào mừng trở lại</h5>
            <p class="subtitle">Đăng nhập để tiếp tục mua sắm</p>

            <form id="loginForm">
                <div class="mb-field">
                    <label class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="mb-field">
                    <label class="form-label">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" class="form-control with-eye" placeholder="Nhập mật khẩu" required>
                        <button type="button" class="btn-eye" onclick="togglePwd('password', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <a href="#" class="forgot-link">Quên mật khẩu?</a>

                <button type="submit" id="btnLogin" class="btn-login">
                    <i class="bi bi-box-arrow-in-right"></i>Đăng nhập
                </button>
            </form>

            <div class="divider">hoặc</div>

            <div class="register-link">
                Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
            </div>

            <div class="trust-row">
                <div class="trust-item">
                    <i class="bi bi-shield-check"></i>
                    Bảo mật
                </div>
                <div class="trust-item">
                    <i class="bi bi-lock-fill"></i>
                    Mã hóa SSL
                </div>
                <div class="trust-item">
                    <i class="bi bi-headset"></i>
                    Hỗ trợ 24/7
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePwd(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }
    </script>

    <script type="module">
        import { handleLogin } from '../js/auth.js';

        const loginForm = document.getElementById('loginForm');
        const btnLogin  = document.getElementById('btnLogin');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnLogin.disabled = true;
            btnLogin.innerHTML = '<span class="spinner-border spinner-border-sm"></span>Đang xử lý...';

            const email    = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            await handleLogin(email, password);

            btnLogin.disabled = false;
            btnLogin.innerHTML = '<i class="bi bi-box-arrow-in-right"></i>Đăng nhập';
        });
    </script>
</body>
</html>
