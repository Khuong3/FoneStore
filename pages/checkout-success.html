<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả thanh toán - FoneStore</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold:        #d4af37;
            --gold-light:  #f5d76e;
            --gold-soft:   rgba(212, 175, 55, 0.08);
            --gold-border: rgba(212, 175, 55, 0.25);
            --dark:        #111111;
            --text:        #1a1a1a;
            --font-main:   'Montserrat', sans-serif;
        }

        body { 
            font-family: var(--font-main);
            background: #ffffff; 
            color: var(--text);
        }

        .page-wrapper {
            padding-top: 68px;
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 60px;
        }

        .result-card { 
            background: white; 
            padding: 45px 35px; 
            border-radius: 24px; 
            border: 1px solid var(--gold-border);
            text-align: center; 
            max-width: 520px; 
            width: 100%; 
            box-shadow: 0 12px 40px rgba(44,24,16,0.06);
            transition: all 0.3s ease;
        }

        .icon-box { 
            font-size: 72px; 
            margin-bottom: 24px; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }
        
        .success-bg {
            background: rgba(34,197,94,0.08);
            color: #22c55e;
            border: 1.5px solid rgba(34,197,94,0.2);
        }

        .error-bg {
            background: rgba(239,68,68,0.08);
            color: #ef4444;
            border: 1.5px solid rgba(239,68,68,0.2);
        }

        .alert-details {
            background: #faf8f5;
            border: 1px solid rgba(212,175,55,0.15) !important;
            border-radius: 16px;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #111;
            font-weight: 700;
            border: none;
            letter-spacing: 0.5px;
            transition: all 0.28s ease;
            box-shadow: 0 6px 18px rgba(212,175,55,0.25);
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(212,175,55,0.35);
            color: #111;
        }
    </style>
</head>
<body>

    <!-- HEADER — loaded by layout.js -->
    <div id="header-container"></div>

    <div class="page-wrapper container">
        <div class="result-card">
            <div id="status-content">
                <div class="spinner-border text-warning" style="width: 3rem; height: 3rem;" role="status"></div>
                <p class="mt-4 fw-medium text-secondary">Đang xác nhận thanh toán từ cổng giao dịch, vui lòng đợi giây lát...</p>
            </div>
        </div>
    </div>

    <!-- FOOTER — loaded by layout.js -->
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { loadLayout } from '../js/layout.js';
        import { db, auth } from '../js/config.js';
        import { doc, getDoc, setDoc, deleteDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

        await loadLayout();

        const urlParams = new URLSearchParams(window.location.search);
        
        // Nhận diện các tham số từ MoMo
        let resultCode = urlParams.get('resultCode');
        let orderId = urlParams.get('orderId');
        let amount = urlParams.get('amount');
        let method = "MoMo";
        let isSuccess = false;

        // Nhận diện các tham số từ ZaloPay
        const statusZP = urlParams.get('status');
        const appTransIdZP = urlParams.get('apptransid');
        const amountZP = urlParams.get('amount');

        if (statusZP !== null || appTransIdZP !== null) {
            method = "ZaloPay";
            orderId = appTransIdZP;
            amount = amountZP;
            isSuccess = (statusZP === "1");
        } else {
            isSuccess = (resultCode === "0");
        }

        const statusContent = document.getElementById('status-content');

        onAuthStateChanged(auth, async (user) => {
            if (isSuccess) {
                try {
                    if (user) {
                        // Tải thông tin người dùng từ Firestore để lấy địa chỉ nhận hàng
                        const userSnap = await getDoc(doc(db, "users", user.uid));
                        const userData = userSnap.exists() ? userSnap.data() : {};

                        const checkoutAddressStr = localStorage.getItem('checkout_shipping_address');
                        let checkoutAddress = null;
                        if (checkoutAddressStr) {
                            try {
                                checkoutAddress = JSON.parse(checkoutAddressStr);
                            } catch (e) {
                                console.warn("Lỗi parse checkout_shipping_address:", e);
                            }
                        }

                        const finalName = (checkoutAddress && checkoutAddress.fullName) ? checkoutAddress.fullName : (userData.fullName || user.email || "Khách hàng");
                        const finalPhone = (checkoutAddress && checkoutAddress.phone) ? checkoutAddress.phone : (userData.phone || "Chưa cập nhật");
                        const finalAddress = (checkoutAddress && checkoutAddress.address) ? checkoutAddress.address : (userData.address || "Chưa cập nhật");
                        const finalProvince = (checkoutAddress && checkoutAddress.province) ? checkoutAddress.province : (userData.province || "");
                        const finalDistrict = (checkoutAddress && checkoutAddress.district) ? checkoutAddress.district : (userData.district || "");
                        const finalWard = (checkoutAddress && checkoutAddress.ward) ? checkoutAddress.ward : (userData.ward || "");

                        const cartItems = JSON.parse(localStorage.getItem('pending_items')) || [];

                        // Đọc thông tin Voucher đã sử dụng
                        const voucherInfoStr = localStorage.getItem('applied_voucher_info');
                        let voucherCode = "";
                        let discountAmount = 0;
                        if (voucherInfoStr) {
                            try {
                                const vInfo = JSON.parse(voucherInfoStr);
                                voucherCode = vInfo.code || "";
                                discountAmount = vInfo.discountAmount || 0;
                                
                                if (voucherCode === "none") {
                                    voucherCode = "";
                                    discountAmount = 0;
                                }
                                
                                // Cập nhật tăng soldCount cho voucher
                                if (voucherCode) {
                                    const vDocRef = doc(db, "vouchers", voucherCode);
                                    const vDocSnap = await getDoc(vDocRef);
                                    if (vDocSnap.exists()) {
                                        const vData = vDocSnap.data();
                                        let vProducts = [...(vData.products || [])];
                                        
                                        cartItems.forEach(item => {
                                            const idx = vProducts.findIndex(p => p.productId === item.id);
                                            if (idx !== -1) {
                                                vProducts[idx].soldCount = (vProducts[idx].soldCount || 0) + item.quantity;
                                            }
                                        });
                                        
                                        await updateDoc(vDocRef, { products: vProducts });
                                    }
                                }
                            } catch (e) {
                                console.error("Lỗi cập nhật soldCount cho voucher:", e);
                            }
                        }

                        // Đọc phí ship động và giảm ship
                        const shipFeeVal = Number(localStorage.getItem('checkout_shipping_fee')) || 30000;
                        const shipDiscountVal = Number(localStorage.getItem('checkout_shipping_discount')) || 0;

                        // Đọc thông tin Voucher Ship đã sử dụng
                        const shipVoucherStr = localStorage.getItem('applied_ship_voucher_info');
                        let shipVoucherCode = "";
                        if (shipVoucherStr) {
                            try {
                                const svInfo = JSON.parse(shipVoucherStr);
                                shipVoucherCode = svInfo.code || "";
                                
                                if (shipVoucherCode === "none") {
                                    shipVoucherCode = "";
                                }
                                
                                if (shipVoucherCode) {
                                    const svDocRef = doc(db, "vouchers", shipVoucherCode);
                                    const svDocSnap = await getDoc(svDocRef);
                                    if (svDocSnap.exists()) {
                                        const svData = svDocSnap.data();
                                        if (svData.type === "shipping" && svData.shippingRule) {
                                            const rule = svData.shippingRule;
                                            await updateDoc(svDocRef, {
                                                "shippingRule.soldCount": (rule.soldCount || 0) + 1
                                            });
                                        }
                                    }
                                }
                            } catch (e) {
                                console.error("Lỗi cập nhật soldCount cho ship voucher:", e);
                            }
                        }
                        
                        // Lưu thông tin chi tiết đơn hàng
                        await setDoc(doc(db, "orders", orderId), {
                            userId: user.uid,
                            customerUID: user.uid, 
                            userEmail: user.email, 
                            fullName: finalName,
                            phone: finalPhone,
                            
                            // Lưu địa chỉ giao nhận chi tiết
                            address: finalAddress,
                            province: finalProvince,
                            district: finalDistrict,
                            ward: finalWard,
                            
                            items: cartItems,
                            
                            amount: Number(amount),
                            totalPrice: Number(amount),  
                            totalAmount: Number(amount), 
                            
                            voucherUsed: voucherCode,
                            discountAmount: discountAmount,

                            // Lưu phí ship & voucher ship
                            shippingFee: shipFeeVal,
                            shippingDiscount: shipDiscountVal,
                            shipVoucherUsed: shipVoucherCode,
                            
                            status: "Hoàn thành",
                            method: method,
                            createdAt: serverTimestamp()
                        });

                        // Gửi email thông báo qua EmailJS
                        try {
                            const orderObj = {
                                userEmail: userData.email || user.email || "",
                                fullName: finalName,
                                phone: finalPhone,
                                address: finalAddress,
                                province: finalProvince,
                                district: finalDistrict,
                                ward: finalWard,
                                items: cartItems,
                                amount: Number(amount),
                                method: method
                            };
                            
                            console.log("Đang tải module email.js...");
                            const { sendOrderConfirmationToCustomer, sendOrderNotificationToStaff } = await import('../js/email.js');
                            
                            console.log("Gửi email cho Khách hàng...");
                            await sendOrderConfirmationToCustomer(orderId, orderObj);
                            
                            console.log("Gửi email cho Staff/Admin...");
                            await sendOrderNotificationToStaff(orderId, orderObj);
                            console.log("Gửi các email thông báo hoàn tất!");
                        } catch (mailErr) {
                            console.error("Lỗi gửi email trong checkout-success:", mailErr);
                        }

                        await deleteDoc(doc(db, "carts", user.uid));
                        localStorage.removeItem('cart');
                        localStorage.removeItem('pending_items'); 
                        localStorage.removeItem('checkout_shipping_address');
                        localStorage.removeItem('applied_voucher_info');
                        localStorage.removeItem('applied_ship_voucher_info');
                        localStorage.removeItem('checkout_shipping_fee');
                        localStorage.removeItem('checkout_shipping_discount');
                        localStorage.removeItem('checkout_buy_now');
                    }
                    showSuccess(orderId, amount);
                } catch (error) {
                    console.error("Lỗi cập nhật đơn hàng:", error);
                    showError("Thanh toán khớp nhưng không thể cập nhật dữ liệu.");
                }
            } else {
                showError("Giao dịch không thành công hoặc bạn đã hủy thanh toán.");
            }
        });

        function showSuccess(id, total) {
            statusContent.innerHTML = `
                <div class="icon-box success-bg"><i class="bi bi-check-circle-fill"></i></div>
                <h2 class="fw-bold mb-3" style="color: var(--text);">Thanh toán thành công!</h2>
                <p class="text-muted small">Cảm ơn bạn đã lựa chọn FoneStore Coffee. Đơn hàng của bạn đang được xử lý.</p>
                
                <div class="alert alert-details text-start mt-4 p-3 border-0">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted small">Mã đơn hàng:</span> 
                        <strong class="text-dark small">${id}</strong>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted small">Phương thức:</span> 
                        <strong class="text-dark small">${method}</strong>
                    </div>
                    <hr class="my-2" style="border-color: rgba(212,175,55,0.1);">
                    <div class="d-flex justify-content-between">
                        <span class="text-muted small fw-bold">Tổng thanh toán:</span> 
                        <strong class="text-danger">${Number(total).toLocaleString()}đ</strong>
                    </div>
                </div>
                
                <div class="d-grid gap-3 mt-4">
                    <a href="../home.html" class="btn btn-gold btn-lg py-2 rounded-pill">Tiếp tục mua sắm</a>
                    <a href="historyorder.html" class="btn btn-outline-dark py-2 rounded-pill fw-semibold" style="font-size: 14px;">Xem lịch sử đơn hàng</a>
                </div>
            `;
        }

        function showError(msg) {
            statusContent.innerHTML = `
                <div class="icon-box error-bg"><i class="bi bi-x-circle-fill"></i></div>
                <h2 class="fw-bold mb-3" style="color: var(--text);">Thanh toán thất bại</h2>
                <p class="text-muted small">${msg}</p>
                
                <div class="d-grid gap-2 mt-4">
                    <a href="../home.html" class="btn btn-dark py-2 rounded-pill fw-semibold" style="font-size: 14px;">Quay lại Trang chủ</a>
                </div>
            `;
        }
    </script>
</body>
</html>
