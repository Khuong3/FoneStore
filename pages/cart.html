<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng — FStore Coffee</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://www.gstatic.com">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ── VARIABLES — đồng bộ header ── */
        :root {
            --gold:        #d4af37;
            --gold-light:  #f5d76e;
            --gold-soft:   rgba(212, 175, 55, 0.1);
            --gold-border: rgba(212, 175, 55, 0.25);
            --black:       #0a0a0a;
            --dark:        #111111;
            --text:        #1a1a1a;
            --muted:       #6b7280;
            --font-main:   'Montserrat', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background: #ffffff;
            color: #1a1a1a;
        }

        .page-wrapper {
            padding-top: 68px;
        }

        /* ═══ CART PAGE ═══ */
        .cart-page {
            min-height: calc(100vh - 68px);
            padding: 36px 0 60px;
        }

        /* Page title */
        .cart-page-title {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
        }

        .cart-page-title h1 {
            font-family: var(--font-main);
            font-size: 1.5rem;
            font-weight: 800;
            color: #1a1a1a;
            margin: 0;
        }

        .cart-page-title .cart-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: var(--gold-soft);
            border: 1px solid var(--gold-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 1.2rem;
        }

        .cart-user-greeting {
            color: #333;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 28px;
        }

        .cart-user-greeting span {
            color: var(--gold);
            font-weight: 700;
        }

        /* ═══ CART ITEMS ═══ */
        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid #f0f0f0;
            background: #fff;
            transition: all 0.3s ease;
            position: relative;
        }

        .cart-item::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            border-radius: 16px 0 0 16px;
            background: linear-gradient(180deg, var(--gold), var(--gold-light));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .cart-item:hover {
            border-color: var(--gold-border);
            box-shadow: 0 6px 24px rgba(0,0,0,0.06);
            transform: translateY(-1px);
        }

        .cart-item:hover::after { opacity: 1; }

        .cart-item-img {
            width: 80px;
            height: 80px;
            border-radius: 14px;
            overflow: hidden;
            flex-shrink: 0;
            background: #fafafa;
            border: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-item-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            padding: 6px;
            transition: transform 0.3s;
        }

        .cart-item:hover .cart-item-img img { transform: scale(1.06); }

        .cart-item-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item-name {
            font-size: 0.9rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cart-item-unit-price {
            font-size: 0.8rem;
            color: #333;
            font-weight: 500;
        }

        /* Quantity stepper */
        .qty-stepper {
            display: inline-flex;
            align-items: center;
            border-radius: 12px;
            border: 1px solid #e8e8e8;
            overflow: hidden;
            background: #fafafa;
        }

        .qty-stepper button {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: #1a1a1a;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-stepper button:hover {
            background: var(--gold-soft);
            color: var(--gold);
        }

        .qty-stepper button:active { transform: scale(0.9); }

        .qty-stepper .qty-val {
            width: 38px;
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: #1a1a1a;
            border-left: 1px solid #e8e8e8;
            border-right: 1px solid #e8e8e8;
            padding: 6px 0;
            background: #fff;
        }

        .cart-item-subtotal {
            font-size: 1rem;
            font-weight: 800;
            color: var(--gold);
            min-width: 100px;
            text-align: right;
            white-space: nowrap;
        }

        /* Delete btn */
        .btn-del {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid #fce4e4;
            background: #fff5f5;
            color: #e74c3c;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s;
            flex-shrink: 0;
            font-size: 0.85rem;
        }

        .btn-del:hover {
            background: #e74c3c;
            color: #fff;
            border-color: #e74c3c;
            transform: scale(1.06);
        }

        /* ═══ SUMMARY PANEL ═══ */
        .summary-panel {
            border-radius: 18px;
            border: 1px solid #f0f0f0;
            background: #fafafa;
            padding: 28px 24px;
            position: sticky;
            top: 100px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }

        .summary-panel h3 {
            font-size: 0.95rem;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .summary-panel h3 i { color: var(--gold); font-size: 0.9rem; }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 0.85rem;
        }

        .summary-row .lbl { color: #333; font-weight: 500; }
        .summary-row .val { font-weight: 600; color: #1a1a1a; }

        .summary-divider {
            border: none;
            height: 1px;
            background: #eaeaea;
            margin: 8px 0;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0 20px;
        }

        .summary-total .lbl {
            font-size: 0.9rem;
            font-weight: 700;
            color: #1a1a1a;
        }

        .summary-total .val {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--gold);
        }

        /* CTA button — match home.html style */
        .btn-checkout {
            width: 100%;
            padding: 14px 24px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #111;
            font-family: var(--font-main);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.35s ease;
            box-shadow: 0 8px 24px rgba(212,175,55,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-checkout:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(212,175,55,0.4);
        }

        .btn-checkout:active { transform: scale(0.98); }

        .btn-checkout:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .summary-note {
            text-align: center;
            margin-top: 14px;
            font-size: 11px;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .summary-continue {
            display: block;
            text-align: center;
            margin-top: 12px;
            color: #333;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .summary-continue:hover { color: var(--gold); }

        /* ═══ EMPTY STATE ═══ */
        .empty-state {
            text-align: center;
            padding: 70px 20px;
        }

        .empty-state-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--gold-soft);
            border: 1px solid var(--gold-border);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            font-size: 2.2rem;
            color: var(--gold);
        }

        .empty-state h3 {
            font-weight: 800;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #333;
            font-size: 0.88rem;
            margin-bottom: 24px;
        }

        .btn-shop {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 32px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #111;
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(212,175,55,0.25);
        }

        .btn-shop:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212,175,55,0.4);
            color: #111;
        }

        /* ═══ SKELETON ═══ */
        .skel {
            background: linear-gradient(90deg, #f3f3f3 25%, #ececec 37%, #f3f3f3 63%);
            background-size: 400% 100%;
            animation: shimmer 1.4s ease infinite;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0%   { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .skeleton-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid #f5f5f5;
        }

        /* ═══ RESPONSIVE ═══ */
        @media (max-width: 991px) {
            .summary-panel { position: static; margin-top: 20px; }
        }

        @media (max-width: 576px) {
            .cart-item {
                flex-wrap: wrap;
                padding: 14px;
                gap: 10px;
            }
            .cart-item-img { width: 64px; height: 64px; }
            .cart-item-info { min-width: calc(100% - 90px); }
            .cart-item-subtotal { min-width: auto; text-align: left; }
            .summary-total .val { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- HEADER — loaded by layout.js -->
    <div id="header-container"></div>

    <div class="page-wrapper">
        <div class="cart-page">
            <div class="container">
                <!-- Title -->
                <div class="cart-page-title">
                    <div class="cart-icon"><i class="bi bi-bag-heart-fill"></i></div>
                    <h1>Giỏ hàng</h1>
                </div>
                <div class="cart-user-greeting">
                    Xin chào, <span id="user-display">Đang tải...</span>
                </div>

                <div class="row g-4">
                    <!-- LEFT: Items -->
                    <div class="col-lg-8">
                        <div class="cart-items" id="cart-items-container">
                            <!-- Skeleton loading -->
                            <div class="skeleton-row">
                                <div class="skel" style="width:80px;height:80px;border-radius:14px;flex-shrink:0;"></div>
                                <div style="flex:1;">
                                    <div class="skel" style="height:14px;width:60%;margin-bottom:8px;"></div>
                                    <div class="skel" style="height:12px;width:35%;"></div>
                                </div>
                                <div class="skel" style="width:110px;height:36px;border-radius:12px;"></div>
                                <div class="skel" style="width:80px;height:16px;"></div>
                            </div>
                            <div class="skeleton-row">
                                <div class="skel" style="width:80px;height:80px;border-radius:14px;flex-shrink:0;"></div>
                                <div style="flex:1;">
                                    <div class="skel" style="height:14px;width:50%;margin-bottom:8px;"></div>
                                    <div class="skel" style="height:12px;width:30%;"></div>
                                </div>
                                <div class="skel" style="width:110px;height:36px;border-radius:12px;"></div>
                                <div class="skel" style="width:80px;height:16px;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- RIGHT: Summary -->
                    <div class="col-lg-4">
                        <div class="summary-panel">
                            <h3><i class="bi bi-receipt-cutoff"></i>Tóm tắt đơn hàng</h3>

                            <div class="summary-row">
                                <span class="lbl">Tạm tính</span>
                                <span class="val" id="subtotal-display">0đ</span>
                            </div>
                            <div class="summary-row">
                                <span class="lbl">Phí vận chuyển</span>
                                <span class="val" style="color: var(--gold); font-weight: 700;">Miễn phí</span>
                            </div>

                            <hr class="summary-divider">

                            <div class="summary-total">
                                <span class="lbl">Tổng cộng</span>
                                <span class="val" id="total-price">0đ</span>
                            </div>

                            <button id="btn-checkout" class="btn-checkout" disabled>
                                <i class="bi bi-wallet2"></i>
                                Thanh toán ZaloPay
                            </button>

                            <div class="summary-note">
                                <i class="bi bi-shield-lock-fill"></i>
                                Thanh toán an toàn & bảo mật
                            </div>

                            <a href="../home.html" class="summary-continue">
                                <i class="bi bi-arrow-left me-1"></i>Tiếp tục mua sắm
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER — loaded by layout.js -->
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
    import { loadLayout } from '../js/layout.js';
    import { auth, db } from '../js/config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, getDoc, setDoc, updateDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js";

    const functions = getFunctions();
    await loadLayout();

    let userUID = null;

    // Đợi trạng thái đăng nhập ban đầu được xác định rõ ràng (bất đồng bộ)
    const initialUser = await new Promise((resolve) => {
        const unsubscribe = onAuthStateChanged(auth, (u) => {
            unsubscribe();
            resolve(u);
        });
    });

    if (initialUser) {
        userUID = initialUser.uid;
        const userSnap = await getDoc(doc(db, "users", userUID));
        document.getElementById('user-display').innerText = (userSnap.exists() && userSnap.data().fullName) ? userSnap.data().fullName : initialUser.email;
        renderCart();

        // Tiếp tục lắng nghe nếu người dùng đăng xuất thủ công
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            }
        });
    } else {
        window.location.href = "login.html";
    }

    async function renderCart() {
        if (!userUID) return;
        const cartSnap = await getDoc(doc(db, "carts", userUID));
        const container = document.getElementById('cart-items-container');
        const checkoutBtn = document.getElementById('btn-checkout');
        let total = 0;

        if (!cartSnap.exists() || !cartSnap.data().items || cartSnap.data().items.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon"><i class="bi bi-bag-x"></i></div>
                    <h3>Giỏ hàng trống</h3>
                    <p>Bạn chưa có sản phẩm nào trong giỏ hàng.<br>Hãy khám phá bộ sưu tập của chúng tôi!</p>
                    <a href="../home.html" class="btn-shop">
                        <i class="bi bi-cup-hot"></i>Khám phá ngay
                    </a>
                </div>
            `;
            document.getElementById('total-price').innerText = "0đ";
            document.getElementById('subtotal-display').innerText = "0đ";
            checkoutBtn.disabled = true;
            return;
        }

        const items = cartSnap.data().items;
        let html = '';
        items.forEach((item, index) => {
            const subtotal = item.price * item.quantity;
            total += subtotal;
            html += `
                <div class="cart-item">
                    <div class="cart-item-img">
                        <img src="${item.img}" alt="${item.name}">
                    </div>
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-unit-price">${item.price.toLocaleString()}đ / sản phẩm</div>
                    </div>
                    <div class="qty-stepper">
                        <button onclick="updateQty(${index}, -1)" title="Giảm"><i class="bi bi-dash"></i></button>
                        <div class="qty-val">${item.quantity}</div>
                        <button onclick="updateQty(${index}, 1)" title="Tăng"><i class="bi bi-plus"></i></button>
                    </div>
                    <div class="cart-item-subtotal">${subtotal.toLocaleString()}đ</div>
                    <button class="btn-del" onclick="removeItem(${index})" title="Xóa">
                        <i class="bi bi-trash3"></i>
                    </button>
                </div>
            `;
        });

        container.innerHTML = html;
        document.getElementById('total-price').innerText = total.toLocaleString() + "đ";
        document.getElementById('subtotal-display').innerText = total.toLocaleString() + "đ";
        checkoutBtn.disabled = false;
    }

    // CẬP NHẬT SỐ LƯỢNG
    window.updateQty = async (index, change) => {
        const cartRef = doc(db, "carts", userUID);
        try {
            await runTransaction(db, async (transaction) => {
                const cartSnap = await transaction.get(cartRef);
                if (!cartSnap.exists()) return;
                let items = [...cartSnap.data().items];
                if (index < 0 || index >= items.length) return;

                const item = items[index];

                let currentStock = 0;
                let productExists = false;
                try {
                    const productRef = doc(db, "products", item.id);
                    const productSnap = await transaction.get(productRef);
                    if (productSnap.exists()) {
                        currentStock = productSnap.data().stock || 0;
                        productExists = true;
                    }
                } catch (e) {
                    console.warn("Không thể đọc product stock:", e);
                }

                if (change > 0) {
                    if (productExists && currentStock <= 0) {
                        throw "Kho không đủ hàng!";
                    }
                    item.quantity += 1;
                    if (productExists) {
                        transaction.update(doc(db, "products", item.id), { stock: currentStock - 1 });
                    }
                } else if (change < 0) {
                    if (item.quantity <= 1) {
                        items.splice(index, 1);
                        if (productExists) {
                            transaction.update(doc(db, "products", item.id), { stock: currentStock + 1 });
                        }
                    } else {
                        item.quantity -= 1;
                        if (productExists) {
                            transaction.update(doc(db, "products", item.id), { stock: currentStock + 1 });
                        }
                    }
                }

                transaction.update(cartRef, { items });
            });
            renderCart();
        } catch (e) {
            console.error("Lỗi cập nhật giỏ hàng:", e);
            alert(typeof e === 'string' ? e : "Lỗi cập nhật giỏ hàng. Vui lòng thử lại.");
        }
    };

    // XÓA SẢN PHẨM
    window.removeItem = async (index) => {
        if (!confirm("Bạn muốn xóa sản phẩm này khỏi giỏ hàng?")) return;
        const cartRef = doc(db, "carts", userUID);
        try {
            const cartSnap = await getDoc(cartRef);
            if (!cartSnap.exists()) return;
            let items = [...cartSnap.data().items];
            if (index < 0 || index >= items.length) return;

            const removedItem = items[index];

            try {
                const productRef = doc(db, "products", removedItem.id);
                const productSnap = await getDoc(productRef);
                if (productSnap.exists()) {
                    const newStock = (productSnap.data().stock || 0) + removedItem.quantity;
                    await updateDoc(productRef, { stock: newStock });
                }
            } catch (stockErr) {
                console.warn("Không thể hoàn trả stock:", stockErr);
            }

            items.splice(index, 1);
            await setDoc(cartRef, { items });
            renderCart();
        } catch (e) {
            console.error("Lỗi xóa sản phẩm:", e);
            alert("Không thể xóa sản phẩm. Vui lòng thử lại.");
        }
    };

    // THANH TOÁN ZALOPAY (Sandbox - API /api/zalopay)
    async function startZaloPayPayment() {
        if (!userUID) return alert("Vui lòng đăng nhập!");

        const btn = document.getElementById('btn-checkout');
        const originalHTML = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Đang kết nối ZaloPay...`;

        try {
            const userDoc = await getDoc(doc(db, "users", userUID));
            const userData = userDoc.exists() ? userDoc.data() : {};

            const cartSnap = await getDoc(doc(db, "carts", userUID));
            const cartItems = cartSnap.data().items || [];

            if (cartItems.length === 0) throw new Error("Giỏ hàng trống!");

            const totalAmount = cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const orderDescription = `FoneStore: ${userData.fullName || auth.currentUser.email}`;

            const response = await fetch('/api/zalopay', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    amount: totalAmount,
                    orderInfo: orderDescription,
                    cartItems: cartItems,
                    userId: userUID
                })
            });

            const data = await response.json();

            if (data.success && data.payUrl) {
                localStorage.setItem('pending_items', JSON.stringify(cartItems));
                window.location.href = data.payUrl;
            } else {
                throw new Error(data.message || "Không thể tạo liên kết thanh toán.");
            }
        } catch (e) {
            console.error(e);
            alert("Lỗi: " + (e.message || e));
            btn.disabled = false;
            btn.innerHTML = originalHTML;
        }
    }

    document.getElementById('btn-checkout').addEventListener('click', startZaloPayPayment);
</script>
</body>
</html>
