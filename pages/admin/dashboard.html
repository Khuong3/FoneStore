<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thống kê Doanh thu - FStore Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --gold:        #d4af37;
            --gold-light:  #f5d76e;
            --gold-soft:   rgba(212, 175, 55, 0.1);
            --gold-border: rgba(212, 175, 55, 0.25);
            --black:       #0a0a0a;
            --dark:        #111111;
            --text-dark:   #1a1a1a;
            --muted:       #6b7280;
            --font-main:   'Montserrat', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: #f8f9fa;
            color: var(--text-dark);
        }

        /* ── SIDEBAR ── */
        .sidebar {
            background-color: #0c0c0c;
            min-height: 100vh;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 24px;
        }

        .sidebar h4 {
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
            padding: 0 16px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar h4 i {
            color: var(--gold);
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 12px 16px;
            border-radius: 8px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .nav-link:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-link.active {
            color: #111;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            font-weight: 700;
        }

        /* ── CARDS ── */
        .stat-card {
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            background: #fff;
            padding: 24px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.02);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 16px;
        }

        .revenue-icon { background-color: rgba(13, 110, 253, 0.1); color: #0d6efd; }
        .orders-icon { background-color: rgba(25, 135, 84, 0.1); color: #198754; }
        .products-icon { background-color: rgba(212, 175, 55, 0.15); color: var(--gold); }

        .stat-card h6 {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .stat-card h3 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--dark);
            margin: 0;
        }

        /* ── CHART BOX ── */
        .chart-card {
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            background: #fff;
            padding: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            margin-bottom: 24px;
            min-height: 400px;
        }

        .chart-card h5 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px dashed #f0f0f0;
            padding-bottom: 12px;
        }

        .chart-card h5 i { color: var(--gold); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- SIDEBAR -->
            <nav class="col-md-2 sidebar d-flex flex-column justify-content-between">
                <div>
                    <h4><i class="bi bi-cup-hot-fill"></i>FSTORE ADMIN</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="dashboard.html">
                                <i class="bi bi-bar-chart-fill"></i> Thống kê
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="products.html">
                                <i class="bi bi-box-seam"></i> Sản phẩm
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="orders.html">
                                <i class="bi bi-receipt"></i> Đơn hàng
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="vouchers.html">
                                <i class="bi bi-tags-fill"></i> Khuyến mãi
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="pb-4">
                    <a class="nav-link text-danger" href="../../home.html">
                        <i class="bi bi-box-arrow-left"></i> Về trang chủ
                    </a>
                </div>
            </nav>
            
            <!-- MAIN CONTENT -->
            <main class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold m-0" style="font-size: 1.6rem; color: var(--dark);">Thống kê hệ thống</h2>
                        <p class="text-muted small m-0">Xem số liệu kinh doanh và báo cáo lượng bán hàng.</p>
                    </div>
                </div>

                <!-- STATS ROW -->
                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="stat-card">
                            <div class="stat-icon revenue-icon"><i class="bi bi-currency-dollar"></i></div>
                            <h6>Tổng doanh thu</h6>
                            <h3 id="total-revenue">0đ</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card">
                            <div class="stat-icon orders-icon"><i class="bi bi-check2-circle"></i></div>
                            <h6>Đơn hoàn thành</h6>
                            <h3 id="order-count">0</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card">
                            <div class="stat-icon products-icon"><i class="bi bi-cup-straw"></i></div>
                            <h6>Sản phẩm đã bán</h6>
                            <h3 id="total-items-sold">0</h3>
                        </div>
                    </div>
                </div>

                <!-- CHARTS ROW -->
                <div class="row g-4">
                    <!-- Column Chart: Product Sales -->
                    <div class="col-lg-8">
                        <div class="chart-card">
                            <h5><i class="bi bi-bar-chart-line-fill"></i> Số lượng từng sản phẩm đã bán</h5>
                            <div style="position: relative; height: 320px; width: 100%;">
                                <canvas id="productsBarChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- Doughnut Chart: Sales Share -->
                    <div class="col-lg-4">
                        <div class="chart-card">
                            <h5><i class="bi bi-pie-chart-fill"></i> Cơ cấu sản phẩm</h5>
                            <div style="position: relative; height: 320px; width: 100%; display: flex; align-items: center; justify-content: center;">
                                <canvas id="productsDoughnutChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { auth, db } from '../../js/config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        let barChartInstance = null;
        let doughnutChartInstance = null;

        // 1. KIỂM TRA PHÂN QUYỀN ADMIN
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "../login.html"; return; }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (!userDoc.exists() || userDoc.data().role !== "admin") {
                alert("Bạn không có quyền truy cập!");
                window.location.href = "../../home.html";
            }
        });

        // 2. TẢI VÀ TÍNH TOÁN DỮ LIỆU THỐNG KÊ
        async function loadStats() {
            try {
                // Lấy các đơn hàng có trạng thái "Hoàn thành"
                const q = query(collection(db, "orders"), where("status", "==", "Hoàn thành"));
                const snapshot = await getDocs(q);
                
                let revenueTotal = 0;
                let itemsSoldTotal = 0;
                
                // Gom nhóm số lượng bán ra của từng sản phẩm: { "Tên SP": số_lượng }
                const productSales = {};

                snapshot.forEach(doc => {
                    const order = doc.data();
                    revenueTotal += (order.totalPrice || order.amount || 0);

                    if (order.items && Array.isArray(order.items)) {
                        order.items.forEach(item => {
                            const name = item.name || "Sản phẩm không tên";
                            const qty = item.quantity || 0;
                            itemsSoldTotal += qty;
                            productSales[name] = (productSales[name] || 0) + qty;
                        });
                    }
                });
                
                // Cập nhật lên thẻ thông số
                document.getElementById('total-revenue').innerText = revenueTotal.toLocaleString() + 'đ';
                document.getElementById('order-count').innerText = snapshot.size;
                document.getElementById('total-items-sold').innerText = itemsSoldTotal.toLocaleString();

                // Chuẩn bị mảng labels (Tên SP) và data (Số lượng) vẽ biểu đồ
                const labels = Object.keys(productSales);
                const salesData = Object.values(productSales);

                if (labels.length === 0) {
                    // Hiển thị thông báo nếu chưa có sản phẩm nào được bán ra
                    document.getElementById('productsBarChart').parentElement.innerHTML = `<div class="text-center py-5 text-muted">Chưa có sản phẩm bán ra để thống kê biểu đồ.</div>`;
                    document.getElementById('productsDoughnutChart').parentElement.innerHTML = `<div class="text-center py-5 text-muted">Chưa có dữ liệu.</div>`;
                    return;
                }

                // Vẽ các biểu đồ
                renderCharts(labels, salesData);

            } catch (err) { 
                console.error("Lỗi tải thông tin thống kê:", err); 
            }
        }

        // 3. VẼ BIỂU ĐỒ BẰNG CHART.JS
        function renderCharts(labels, data) {
            // Hủy biểu đồ cũ nếu đã tồn tại để tránh xung đột
            if (barChartInstance) barChartInstance.destroy();
            if (doughnutChartInstance) doughnutChartInstance.destroy();

            // Mảng màu sắc ngẫu nhiên, nhẹ nhàng sang trọng
            const backgroundColors = [
                '#d4af37', // Gold chủ đạo FStore
                '#1a0e0a', // Đen thẫm
                '#3e2215', // Nâu đậm
                '#6f4e37', // Nâu vừa
                '#c4a882', // Vàng kem
                '#a0a0a0', // Xám mờ
                '#198754', // Xanh lá
                '#0d6efd', // Xanh dương
                '#dc3545', // Đỏ
                '#6f42c1'  // Tím
            ];

            // A. BIỂU ĐỒ CỘT (BAR CHART) - SỐ LƯỢNG
            const ctxBar = document.getElementById('productsBarChart').getContext('2d');
            barChartInstance = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Số lượng bán ra',
                        data: data,
                        backgroundColor: '#d4af37', // Màu Gold của FStore
                        borderColor: '#b4932c',
                        borderWidth: 1,
                        borderRadius: 8,
                        barPercentage: 0.5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                precision: 0 // chỉ hiển thị số nguyên
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        },
                        x: {
                            grid: { display: false }
                        }
                    }
                }
            });

            // B. BIỂU ĐỒ TRÒN (DOUGHNUT CHART) - TỶ LỆ CƠ CẤU
            const ctxDoughnut = document.getElementById('productsDoughnutChart').getContext('2d');
            doughnutChartInstance = new Chart(ctxDoughnut, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: backgroundColors.slice(0, labels.length),
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                boxWidth: 12,
                                font: { size: 10, family: 'Montserrat' }
                            }
                        }
                    },
                    cutout: '65%'
                }
            });
        }

        loadStats();
    </script>
</body>
</html>
