<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Thành viên - FStore Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold:        #d4af37;
            --gold-light:  #f5d76e;
            --gold-soft:   rgba(212, 175, 55, 0.1);
            --gold-border: rgba(212, 175, 55, 0.25);
            --black:       #0a0a0a;
            --dark:        #111111;
            --text-dark:   #1a1a1a;
            --muted:       #6b7280;
            --font-main:   'Montserrat', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: #f8f9fa;
            color: var(--text-dark);
        }

        /* ── SIDEBAR ── */
        .sidebar {
            background-color: #0c0c0c;
            min-height: 100vh;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 24px;
        }

        .sidebar h4 {
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
            padding: 0 16px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar h4 i {
            color: var(--gold);
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 12px 16px;
            border-radius: 8px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
            text-decoration: none;
        }

        .nav-link:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-link.active {
            color: #111;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            font-weight: 700;
        }

        .table {
            color: #111111 !important;
        }
        .text-muted {
            color: #555555 !important;
        }
        .form-select-sm, .form-control-sm {
            color: #111111 !important;
            font-weight: 500;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <!-- SIDEBAR -->
            <nav class="col-md-2 sidebar d-flex flex-column justify-content-between">
                <div>
                    <h4><i class="bi bi-cup-hot-fill"></i>FSTORE ADMIN</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard.html">
                                <i class="bi bi-bar-chart-fill"></i> Thống kê
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="products.html">
                                <i class="bi bi-box-seam"></i> Sản phẩm
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="orders.html">
                                <i class="bi bi-receipt"></i> Đơn hàng
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="vouchers.html">
                                <i class="bi bi-tags-fill"></i> Khuyến mãi
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="users.html">
                                <i class="bi bi-people-fill"></i> Thành viên
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="pb-4">
                    <a class="nav-link text-danger" href="../../home.html">
                        <i class="bi bi-box-arrow-left"></i> Về trang chủ
                    </a>
                </div>
            </nav>

            <!-- MAIN CONTENT -->
            <main class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3>Quản lý Thành viên</h3>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-secondary" onclick="loadUsers()"><i class="bi bi-arrow-clockwise me-1"></i>Làm mới</button>
                    </div>
                </div>

                <!-- BỘ LỌC TÌM KIẾM -->
                <div class="card p-3 mb-4 border-0 shadow-sm">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label text-muted small fw-bold">Tìm kiếm người dùng</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                                <input type="text" id="search-input" class="form-control border-start-0" placeholder="Nhập tên hoặc email..." onkeyup="filterUsers()">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted small fw-bold">Vai trò (Role)</label>
                            <select id="role-filter" class="form-select" onchange="filterUsers()">
                                <option value="all">Tất cả vai trò</option>
                                <option value="admin">Quản trị viên (Admin)</option>
                                <option value="staff">Nhân viên (Staff)</option>
                                <option value="customer">Khách hàng (Customer)</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-muted small fw-bold">Trạng thái</label>
                            <select id="status-filter" class="form-select" onchange="filterUsers()">
                                <option value="all">Tất cả trạng thái</option>
                                <option value="active">Hoạt động (Active)</option>
                                <option value="blocked">Đang bị khóa (Blocked)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- DANH SÁCH THÀNH VIÊN -->
                <div class="card border-0 shadow-sm">
                    <div class="table-responsive">
                        <table class="table align-middle table-hover mb-0 bg-white">
                            <thead class="table-dark">
                                <tr>
                                    <th>Họ và tên</th>
                                    <th>Email</th>
                                    <th>UID</th>
                                    <th>Vai trò</th>
                                    <th>Trạng thái</th>
                                    <th class="text-end">Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="user-list-tbody">
                                <tr>
                                    <td colspan="6" class="text-center py-4 text-muted">Đang tải dữ liệu...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { auth, db } from '../../js/config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { doc, getDoc, updateDoc, setDoc, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        let allUsers = [];

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "../login.html"; return; }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (!userDoc.exists() || userDoc.data().role !== "admin") {
                alert("Bạn không có quyền truy cập trang này!");
                window.location.href = "../../home.html";
                return;
            }
            if (userDoc.data().status === "blocked") {
                alert("Tài khoản của bạn đã bị khóa!");
                await auth.signOut();
                window.location.href = "../../home.html";
                return;
            }
            loadUsers();
        });

        window.loadUsers = async () => {
            const tbody = document.getElementById("user-list-tbody");
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm me-2"></div>Đang tải dữ liệu...</td></tr>`;
            try {
                const snap = await getDocs(collection(db, "users"));
                allUsers = [];
                snap.forEach(d => {
                    allUsers.push({ id: d.id, ...d.data() });
                });
                renderUsers(allUsers);
            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Lỗi tải dữ liệu: ${err.message}</td></tr>`;
            }
        };

        function renderUsers(usersList) {
            const tbody = document.getElementById("user-list-tbody");
            if (usersList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">Không có người dùng nào khớp điều kiện.</td></tr>`;
                return;
            }

            let html = "";
            usersList.forEach(u => {
                const isBlocked = u.status === "blocked";
                
                let roleBadge = "";
                if (u.role === "admin") roleBadge = '<span class="badge bg-danger text-white">Admin</span>';
                else if (u.role === "staff") roleBadge = '<span class="badge bg-primary text-white">Staff</span>';
                else roleBadge = '<span class="badge bg-secondary text-white">Customer</span>';

                let statusBadge = "";
                if (isBlocked) statusBadge = '<span class="badge bg-dark text-white"><i class="bi bi-lock-fill me-1"></i>Bị khóa</span>';
                else statusBadge = '<span class="badge bg-success text-white"><i class="bi bi-check-circle-fill me-1"></i>Hoạt động</span>';

                // Nút thao tác Khóa / Mở khóa
                let blockButton = "";
                // Không cho tự khóa chính mình
                if (u.id === auth.currentUser.uid) {
                    blockButton = `<span class="text-muted small">Tài khoản hiện tại</span>`;
                } else {
                    const blockActionText = isBlocked ? "Mở khóa" : "Khóa";
                    const blockClass = isBlocked ? "btn-outline-success" : "btn-outline-danger";
                    
                    blockButton = `
                        <div class="d-flex align-items-center justify-content-end gap-2">
                            <select class="form-select form-select-sm w-auto border-secondary" onchange="changeRole('${u.id}', '${u.email || u.fullName}', this.value)">
                                <option value="customer" ${u.role === 'customer' ? 'selected' : ''}>Customer</option>
                                <option value="staff" ${u.role === 'staff' ? 'selected' : ''}>Staff</option>
                                <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
                            </select>
                            <button class="btn btn-sm ${blockClass}" onclick="toggleUserStatus('${u.id}', '${u.email || u.fullName}', ${isBlocked})">
                                ${blockActionText}
                            </button>
                        </div>
                    `;
                }

                html += `
                    <tr class="${isBlocked ? 'opacity-75 bg-light' : ''}">
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div class="bg-secondary-subtle rounded-circle p-2 d-flex align-items-center justify-content-center" style="width:36px; height:36px;">
                                    <i class="bi bi-person text-secondary"></i>
                                </div>
                                <span class="fw-bold">${u.fullName || "Khách hàng FStore"}</span>
                            </div>
                        </td>
                        <td><b>${u.email || "N/A"}</b></td>
                        <td><small class="text-muted text-break">${u.id}</small></td>
                        <td>${roleBadge}</td>
                        <td>${statusBadge}</td>
                        <td class="text-end">${blockButton}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        window.filterUsers = () => {
            const queryVal = document.getElementById("search-input").value.toLowerCase();
            const roleFilter = document.getElementById("role-filter").value;
            const statusFilter = document.getElementById("status-filter").value;

            const filtered = allUsers.filter(u => {
                const name = (u.fullName || "").toLowerCase();
                const email = (u.email || "").toLowerCase();
                const matchesQuery = name.includes(queryVal) || email.includes(queryVal);
                
                const matchesRole = roleFilter === "all" || u.role === roleFilter;
                
                let matchesStatus = true;
                if (statusFilter === "blocked") {
                    matchesStatus = u.status === "blocked";
                } else if (statusFilter === "active") {
                    matchesStatus = u.status !== "blocked";
                }

                return matchesQuery && matchesRole && matchesStatus;
            });

            renderUsers(filtered);
        };

        window.changeRole = async (userId, userEmail, newRole) => {
            if (!confirm(`Bạn có chắc chắn muốn đổi quyền của tài khoản [${userEmail}] thành [${newRole.toUpperCase()}]?`)) {
                loadUsers();
                return;
            }

            try {
                const userRef = doc(db, "users", userId);
                const oldSnap = await getDoc(userRef);
                const oldRole = oldSnap.data().role || "customer";

                await updateDoc(userRef, { role: newRole });

                // Ghi log hoạt động hệ thống
                await addDoc(collection(db, "system_logs"), {
                    type: "role_change",
                    operatorId: auth.currentUser.uid,
                    operatorEmail: auth.currentUser.email,
                    targetUserId: userId,
                    targetUserEmail: userEmail,
                    oldRole: oldRole,
                    newRole: newRole,
                    timestamp: new Date(),
                    details: `Đã đổi vai trò của người dùng ${userEmail} từ ${oldRole} sang ${newRole}`
                });

                alert("Đã cập nhật quyền thành công!");
                loadUsers();
            } catch (err) {
                alert("Lỗi khi cập nhật quyền: " + err.message);
                loadUsers();
            }
        };

        window.toggleUserStatus = async (userId, userEmail, wasBlocked) => {
            const newStatus = wasBlocked ? "active" : "blocked";
            const actionText = wasBlocked ? "mở khóa" : "khóa";
            if (!confirm(`Xác nhận ${actionText} tài khoản [${userEmail}]?`)) return;

            try {
                const userRef = doc(db, "users", userId);
                await updateDoc(userRef, { status: newStatus });

                // Ghi log hoạt động hệ thống
                await addDoc(collection(db, "system_logs"), {
                    type: wasBlocked ? "user_unblock" : "user_block",
                    operatorId: auth.currentUser.uid,
                    operatorEmail: auth.currentUser.email,
                    targetUserId: userId,
                    targetUserEmail: userEmail,
                    timestamp: new Date(),
                    details: `Đã ${actionText} tài khoản người dùng: ${userEmail}`
                });

                alert(`Đã ${actionText} tài khoản thành công!`);
                loadUsers();
            } catch (err) {
                alert(`Lỗi khi ${actionText} tài khoản: ` + err.message);
            }
        };
    </script>
</body>
</html>
