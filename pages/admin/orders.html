<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý đơn hàng - FoneStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold:        #d4af37;
            --gold-light:  #f5d76e;
            --gold-soft:   rgba(212, 175, 55, 0.1);
            --gold-border: rgba(212, 175, 55, 0.25);
            --black:       #0a0a0a;
            --dark:        #111111;
            --text-dark:   #1a1a1a;
            --muted:       #6b7280;
            --font-main:   'Montserrat', sans-serif;
        }

        body {
            font-family: var(--font-main);
            color: var(--text-dark);
        }

        /* ── SIDEBAR ── */
        .sidebar {
            background-color: #0c0c0c;
            min-height: 100vh;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 24px;
        }

        .sidebar h4 {
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
            padding: 0 16px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar h4 i {
            color: var(--gold);
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 12px 16px;
            border-radius: 8px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
            text-decoration: none;
        }

        .nav-link:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-link.active {
            color: #111;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            font-weight: 700;
        }

        .table {
            color: #111111 !important;
        }
        .text-muted {
            color: #222222 !important;
        }
        .badge.bg-light {
            color: #111111 !important;
            border-color: #cccccc !important;
        }
        select.form-select-sm {
            color: #111111 !important;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <!-- SIDEBAR -->
            <nav class="col-md-2 sidebar d-flex flex-column justify-content-between">
                <div>
                    <h4><i class="bi bi-cup-hot-fill"></i>FSTORE ADMIN</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard.html">
                                <i class="bi bi-bar-chart-fill"></i> Thống kê
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="products.html">
                                <i class="bi bi-box-seam"></i> Sản phẩm
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="orders.html">
                                <i class="bi bi-receipt"></i> Đơn hàng
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="vouchers.html">
                                <i class="bi bi-tags-fill"></i> Khuyến mãi
                            </a>
                        </li>
                        <li class="nav-item" id="sidebar-users-li" style="display: none;">
                            <a class="nav-link" href="users.html">
                                <i class="bi bi-people-fill"></i> Thành viên
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="pb-4">
                    <a class="nav-link text-danger" href="../../home.html">
                        <i class="bi bi-box-arrow-left"></i> Về trang chủ
                    </a>
                </div>
            </nav>
            <main class="col-md-10 p-4">
                <h3 class="mb-4">Danh sách đơn hàng</h3>
                <div id="order-list" class="table-responsive">
                    <p>Đang tải dữ liệu...</p>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { auth, db } from '../../js/config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { doc, getDoc, setDoc, collection, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "../login.html"; return; }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (!userDoc.exists() || (userDoc.data().role !== "admin" && userDoc.data().role !== "staff")) {
                window.location.href = "../../home.html";
                return;
            }
            if (userDoc.data().status === "blocked") {
                alert("Tài khoản của bạn đã bị khóa!");
                await auth.signOut();
                window.location.href = "../../home.html";
                return;
            }
            const role = userDoc.data().role;
            if (role === "admin") {
                const userLi = document.getElementById("sidebar-users-li");
                if (userLi) userLi.style.display = "block";
            }
            if (role === "staff") {
                const sidebarLinks = document.querySelectorAll('.sidebar .nav-link');
                sidebarLinks.forEach(link => {
                    const href = link.getAttribute('href');
                    if (href && (href.includes('dashboard.html') || href.includes('vouchers.html'))) {
                        link.parentElement.style.display = 'none';
                    }
                });
            }
            
            // Chạy kiểm tra gửi báo cáo cuối ngày lúc 5h chiều
            checkAndSendDailySummary();
        });

        async function checkAndSendDailySummary() {
            const now = new Date();
            const hours = now.getHours();
            
            // Chỉ gửi nếu giờ hiện tại >= 17 (5h chiều)
            if (hours >= 17) {
                const todayStr = now.toISOString().slice(0, 10); // Định dạng YYYY-MM-DD
                const docRef = doc(db, "system_settings", "daily_summary");
                
                try {
                    const summaryDoc = await getDoc(docRef);
                    if (!summaryDoc.exists() || summaryDoc.data().lastSentDate !== todayStr) {
                        console.log("Tiến hành gửi báo cáo đơn hàng chưa hoàn thành cuối ngày...");
                        
                        // Lấy tất cả các đơn hàng có trạng thái KHÁC "Hoàn thành" và "Hủy"
                        const snapshot = await getDocs(collection(db, "orders"));
                        const incompleteOrders = [];
                        snapshot.forEach(doc => {
                            const o = doc.data();
                            if (o.status !== "Hoàn thành" && o.status !== "Hủy") {
                                incompleteOrders.push({ id: doc.id, ...o });
                            }
                        });
                        
                        if (incompleteOrders.length === 0) {
                            console.log("Không có đơn hàng nào chưa hoàn thành.");
                            await setDoc(docRef, { lastSentDate: todayStr }, { merge: true });
                            return;
                        }
                        
                        // Tạo nội dung tóm tắt
                        let summaryContent = `Báo cáo ngày ${new Date().toLocaleDateString("vi-VN")}:\n`;
                        summaryContent += `Có tổng cộng ${incompleteOrders.length} đơn hàng chưa hoàn thành và cần xử lý:\n\n`;
                        incompleteOrders.forEach((o, index) => {
                            const itemsStr = o.items ? o.items.map(i => `${i.name} x${i.quantity}`).join(", ") : "Không có";
                            summaryContent += `${index + 1}. Đơn hàng #${o.id || o.orderId}\n`;
                            summaryContent += `   - Khách hàng: ${o.fullName || "N/A"} (${o.phone || "N/A"})\n`;
                            summaryContent += `   - Trạng thái: ${o.status || "N/A"}\n`;
                            summaryContent += `   - Trị giá: ${Number(o.amount).toLocaleString()}đ\n`;
                            summaryContent += `   - Chi tiết sản phẩm: ${itemsStr}\n`;
                            summaryContent += `   - Địa chỉ: ${o.address || ""}, ${o.ward || ""}, ${o.district || ""}, ${o.province || ""}\n\n`;
                        });
                        
                        // Lấy toàn bộ email của Admin và Staff
                        const emailList = [];
                        const usersSnap = await getDocs(collection(db, "users"));
                        usersSnap.forEach(d => {
                            const u = d.data();
                            if ((u.role === "admin" || u.role === "staff") && u.email) {
                                emailList.push(u.email);
                            }
                        });
                        
                        if (emailList.length === 0) {
                            emailList.push("admin_fonestore@mailinator.com");
                        }
                        
                        // Gửi email
                        const { sendDailyIncompleteOrdersSummary } = await import('../../js/email.js');
                        await sendDailyIncompleteOrdersSummary(emailList, summaryContent);
                        
                        // Lưu trạng thái đã gửi hôm nay
                        await setDoc(docRef, { lastSentDate: todayStr }, { merge: true });
                        console.log("Gửi báo cáo cuối ngày thành công!");
                    }
                } catch (err) {
                    console.error("Lỗi khi kiểm tra/gửi báo cáo cuối ngày:", err);
                }
            }
        }

        async function loadOrders() {
            try {
                const snapshot = await getDocs(collection(db, "orders"));
                
                // Gom nhóm để tính tổng số đơn hàng đã mua của mỗi khách hàng
                const userOrderCounts = {};
                snapshot.forEach(oDoc => {
                    const o = oDoc.data();
                    if (o.userId) {
                        userOrderCounts[o.userId] = (userOrderCounts[o.userId] || 0) + 1;
                    }
                });

                let html = '<table class="table align-middle table-hover bg-white border shadow-sm rounded">';
                html += `<thead class="table-dark">
                    <tr>
                        <th style="width: 25%;">Khách hàng</th>
                        <th style="width: 30%;">Thông tin Giao nhận</th>
                        <th style="width: 25%;">Sản phẩm & Giá</th>
                        <th style="width: 20%;">Cập nhật Trạng thái</th>
                    </tr>
                </thead><tbody>`;
                
                snapshot.forEach(oDoc => {
                    const o = oDoc.data();
                    
                    // 1. Thông tin khách hàng
                    const customerName = o.fullName || "Khách hàng FStore";
                    const email = o.userEmail || o.userId || 'Không rõ';
                    const phone = o.phone || "Chưa cập nhật SĐT";
                    const purchaseCount = o.userId ? (userOrderCounts[o.userId] || 1) : 1;
                    
                    // 2. Địa chỉ & Thời gian giao nhận
                    const fullAddress = o.address 
                        ? `${o.address}${o.ward ? ', ' + o.ward : ''}${o.district ? ', ' + o.district : ''}${o.province ? ', ' + o.province : ''}`
                        : "Chưa cập nhật địa chỉ";
                    
                    const dateStr = o.createdAt?.toDate
                        ? o.createdAt.toDate().toLocaleString('vi-VN')
                        : (o.createdAt || 'N/A');
                        
                    let estDeliveryStr = 'Chưa xác định';
                    if (o.createdAt?.toDate) {
                        const orderDate = o.createdAt.toDate();
                        const estDate = new Date(orderDate.getTime() + 7 * 24 * 60 * 60 * 1000);
                        estDeliveryStr = estDate.toLocaleDateString('vi-VN');
                    }

                    // 3. Sản phẩm & Số tiền
                    const safePrice = Number(o.totalPrice || o.amount || o.totalAmount || 0);
                    const itemNames = (o.items || []).map(i => `<div class="small text-muted">- ${i.name} <strong class="text-dark">x${i.quantity || 1}</strong></div>`).join('') || '<span class="text-muted">Không có sản phẩm</span>';
                    
                    // 4. Trạng thái đơn hàng
                    const listStatus = ["pending_payment", "Chờ xác nhận", "Đang xử lý", "Đang giao", "Hoàn thành", "Hủy"];
                    let selectHtml = `<select class="form-select form-select-sm" onchange="updateStatus('${oDoc.id}', this.value)">`;
                    listStatus.forEach(s => {
                        selectHtml += `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s}</option>`;
                    });
                    selectHtml += `</select>`;

                    // Phân biệt màu badge trạng thái
                    let statusBadgeClass = "bg-secondary";
                    if (o.status === "Hoàn thành") statusBadgeClass = "bg-success";
                    else if (o.status === "Hủy") statusBadgeClass = "bg-danger";
                    else if (o.status === "Đang giao") statusBadgeClass = "bg-info text-dark";
                    else if (o.status === "Đang xử lý") statusBadgeClass = "bg-primary";
                    else if (o.status === "Chờ xác nhận") statusBadgeClass = "bg-warning text-dark";

                    html += `<tr>
                        <!-- Cột 1: Khách hàng -->
                        <td>
                            <div class="fw-bold text-dark">${customerName}</div>
                            <div class="small text-muted"><i class="bi bi-telephone"></i> ${phone}</div>
                            <div class="small text-muted"><i class="bi bi-envelope"></i> ${email}</div>
                            <div class="mt-1">
                                <span class="badge bg-light text-dark border"><i class="bi bi-bag-check"></i> Đã mua: ${purchaseCount} đơn</span>
                            </div>
                        </td>
                        <!-- Cột 2: Giao nhận -->
                        <td>
                            <div class="small mb-1"><i class="bi bi-geo-alt-fill text-danger"></i> <strong>Địa chỉ:</strong> ${fullAddress}</div>
                            <div class="small mb-1"><i class="bi bi-calendar3"></i> <strong>Đặt lúc:</strong> ${dateStr}</div>
                            <div class="small"><i class="bi bi-truck text-success"></i> <strong>Dự kiến:</strong> <span class="text-success fw-bold">${estDeliveryStr} (7 ngày)</span></div>
                        </td>
                        <!-- Cột 3: Sản phẩm & Giá -->
                        <td>
                            <div class="mb-2">${itemNames}</div>
                            <div><strong>Tổng:</strong> <span class="text-danger fw-bold">${safePrice.toLocaleString()}đ</span></div>
                            <div class="small text-muted">Mã GD: <small class="text-secondary">${oDoc.id.substring(0,8).toUpperCase()}</small></div>
                        </td>
                        <!-- Cột 4: Trạng thái & Hành động -->
                        <td>
                            <div class="mb-2">
                                <span class="badge ${statusBadgeClass} d-inline-block px-3 py-2 fw-semibold">${o.status || 'N/A'}</span>
                            </div>
                            <div>${selectHtml}</div>
                        </td>
                    </tr>`;
                });
                
                if(snapshot.empty) html += '<tr><td colspan="4" class="text-center py-4 text-muted">Chưa có đơn hàng nào</td></tr>';
                document.getElementById('order-list').innerHTML = html + '</tbody></table>';
            } catch (err) {
                console.error("Lỗi:", err);
                document.getElementById('order-list').innerHTML = '<p class="text-danger">Lỗi khi tải đơn hàng.</p>';
            }
        }

        window.updateStatus = async (id, newStatus) => {
            try {
                await updateDoc(doc(db, "orders", id), { status: newStatus });
                alert("Đã chuyển trạng thái sang: " + newStatus);
                loadOrders(); 
            } catch (err) { alert("Lỗi: " + err.message); }
        };

        loadOrders();
    </script>
</body>
</html>
