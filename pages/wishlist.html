<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách yêu thích - FoneStore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold:        #d4af37;
            --gold-light:  #f5d76e;
            --gold-soft:   rgba(212, 175, 55, 0.08);
            --gold-border: rgba(212, 175, 55, 0.25);
            --dark:        #111111;
            --text:        #1a1a1a;
            --muted:       #6b7280;
            --font-main:   'Montserrat', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background: #f7f7f5;
            color: var(--text);
            padding-top: 68px; /* fixed header */
        }

        /* ── PAGE WRAPPER ── */
        .page-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 36px 20px 60px;
        }

        /* ── PAGE HEADING ── */
        .page-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-heading .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-heading .bar {
            width: 4px;
            height: 26px;
            border-radius: 4px;
            background: linear-gradient(180deg, var(--gold), var(--gold-light));
            flex-shrink: 0;
        }
        .page-heading h2 {
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--dark);
            margin: 0;
        }
        .page-heading .count-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 999px;
            background: var(--gold-soft);
            border: 1px solid var(--gold-border);
            color: var(--gold);
            letter-spacing: 0.5px;
        }

        /* Back button */
        .btn-back {
            font-family: var(--font-main);
            font-size: 12px;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            border: 1.5px solid #e0e0e0;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s;
        }
        .btn-back:hover {
            border-color: var(--gold-border);
            color: var(--gold);
            background: var(--gold-soft);
        }

        /* ── WISHLIST CARDS ── */
        .wishlist-card {
            background: #fff;
            border: 1px solid #f0f0f0;
            border-radius: 18px;
            overflow: hidden;
            transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
            height: 100%;
        }
        .wishlist-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(0,0,0,0.09);
            border-color: rgba(212,175,55,0.3);
        }

        .wishlist-img-wrap {
            overflow: hidden;
            background: #fafafa;
            border-bottom: 1px solid #f5f5f5;
        }
        .wishlist-img {
            width: 100%;
            height: 190px;
            object-fit: contain;
            padding: 24px;
            transition: transform 0.35s ease;
        }
        .wishlist-card:hover .wishlist-img {
            transform: scale(1.05);
        }

        .wishlist-card .card-body {
            padding: 16px 18px 20px;
        }
        .wishlist-card h6 {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }
        .wishlist-card .price-text {
            font-size: 15px;
            font-weight: 800;
            color: var(--gold);
            margin-bottom: 14px;
        }

        /* Remove button */
        .btn-remove {
            font-family: var(--font-main);
            font-size: 11.5px;
            font-weight: 700;
            padding: 9px 12px;
            border-radius: 999px;
            background: transparent;
            color: #e63946;
            border: 1.5px solid rgba(230,57,70,0.25);
            width: 100%;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-remove:hover {
            background: rgba(230,57,70,0.06);
            border-color: rgba(230,57,70,0.5);
        }

        /* View detail link */
        .btn-view {
            font-family: var(--font-main);
            font-size: 11.5px;
            font-weight: 700;
            padding: 9px 12px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #111;
            border: none;
            width: 100%;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            margin-bottom: 8px;
            box-shadow: 0 4px 12px rgba(212,175,55,0.2);
        }
        .btn-view:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(212,175,55,0.35);
            color: #111;
        }

        /* ── EMPTY STATE ── */
        .empty-box {
            background: #fff;
            border-radius: 24px;
            border: 1px solid #f0f0f0;
            padding: 80px 24px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
        }
        .empty-icon-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(230,57,70,0.07);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .empty-icon-wrap i {
            font-size: 2rem;
            color: #e63946;
        }
        .empty-box h4 {
            font-weight: 800;
            font-size: 16px;
            color: var(--dark);
            margin-bottom: 8px;
        }
        .empty-box p {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 24px;
        }
        .btn-shop {
            font-family: var(--font-main);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 12px 28px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #111;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(212,175,55,0.25);
            transition: all 0.25s;
        }
        .btn-shop:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(212,175,55,0.4);
            color: #111;
        }

        @media (max-width: 768px) {
            .page-heading h2 { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div id="header-container"></div>

    <div class="page-wrapper">

        <!-- Heading -->
        <div class="page-heading">
            <div class="title-group">
                <div class="bar"></div>
                <h2>Sản phẩm yêu thích</h2>
                <span class="count-badge" id="wish-count">0 sản phẩm</span>
            </div>
            <a href="../home.html" class="btn-back">
                <i class="bi bi-arrow-left"></i> Tiếp tục mua sắm
            </a>
        </div>

        <!-- Wishlist grid -->
        <div id="wishlist-content" class="row g-4"></div>

    </div>

    <!-- FOOTER -->
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { loadLayout } from '../js/layout.js';
        import { auth, db } from '../js/config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        await loadLayout();

        onAuthStateChanged(auth, async (user) => {
            const authSection = document.getElementById('auth-section');
            const adminBtn    = document.getElementById('admin-link');

            // Cập nhật wishlist badge
            const wl  = JSON.parse(localStorage.getItem('wishlist')) || [];
            const wel = document.getElementById('wishlist-count');
            if (wel) wel.textContent = wl.length;

            if (user) {
                const userRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userRef);
                let userData  = {};

                if (userDoc.exists()) {
                    userData = userDoc.data();
                    if (userData.role === 'admin' && adminBtn) adminBtn.style.display = 'inline-block';
                } else {
                    userData = { fullName: '', phone: '', email: user.email || '', address: '', province: '', district: '', ward: '', role: 'customer' };
                    await setDoc(userRef, userData);
                }

                if (authSection) {
                    authSection.innerHTML = `
                        <span style="font-family:var(--font-main,sans-serif); font-size:13px; color:#f5f5f5;">Chào,
                            <b style="color:#d4af37;">${userData.fullName || user.email}</b>
                        </span>
                        <button id="logout-btn" class="btn btn-sm" style="font-size:11px;font-weight:700;padding:6px 14px;border-radius:999px;border:1px solid rgba(230,57,70,0.5);color:#e63946;background:transparent;">Thoát</button>`;
                    document.getElementById('logout-btn')?.addEventListener('click', () => signOut(auth).then(() => location.reload()));
                }

                // Cập nhật cart badge
                const cartSnap = await getDoc(doc(db, "carts", user.uid));
                const cartEl   = document.getElementById('cart-count');
                if (cartEl) cartEl.textContent = cartSnap.exists()
                    ? cartSnap.data().items.reduce((s, i) => s + i.quantity, 0)
                    : 0;
            }
        });
    </script>

    <script>
        function renderWishlist() {
            const wishlist  = JSON.parse(localStorage.getItem('wishlist')) || [];
            const container = document.getElementById('wishlist-content');
            const countEl   = document.getElementById('wish-count');

            if (countEl) countEl.textContent = wishlist.length + ' sản phẩm';

            if (wishlist.length === 0) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="empty-box">
                            <div class="empty-icon-wrap">
                                <i class="bi bi-heart"></i>
                            </div>
                            <h4>Bạn chưa thích sản phẩm nào</h4>
                            <p>Hãy khám phá và lưu những sản phẩm bạn yêu thích nhé.</p>
                            <a href="../home.html" class="btn-shop">
                                <i class="bi bi-shop"></i> Khám phá ngay
                            </a>
                        </div>
                    </div>`;
                return;
            }

            container.innerHTML = wishlist.map(item => `
                <div class="col-xl-3 col-md-4 col-sm-6">
                    <div class="wishlist-card">
                        <div class="wishlist-img-wrap">
                            <a href="product-detail.html?id=${item.id}">
                                <img src="${item.img}" class="wishlist-img" alt="${item.name}">
                            </a>
                        </div>
                        <div class="card-body">
                            <h6>${item.name}</h6>
                            <p class="price-text">${Number(item.price || 0).toLocaleString()}đ</p>
                            <a href="product-detail.html?id=${item.id}" class="btn-view">
                                <i class="bi bi-eye"></i> Xem sản phẩm
                            </a>
                            <button class="btn-remove" onclick="removeFromWishlist('${item.id}')">
                                <i class="bi bi-trash"></i> Xóa khỏi danh sách
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.removeFromWishlist = (id) => {
            let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
            wishlist = wishlist.filter(item => item.id !== id);
            localStorage.setItem('wishlist', JSON.stringify(wishlist));
            renderWishlist();

            // Cập nhật badge trên header
            const wel = document.getElementById('wishlist-count');
            if (wel) wel.textContent = wishlist.length;
        };

        renderWishlist();
    </script>
</body>
</html>
